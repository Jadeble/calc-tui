[package]
name = "calc-tui"
version = "0.1.0"
edition = "2024"
description = "终端 TUI 科学计算器: 三角函数/对数/阶乘/求和Σ/定积分/求导, 支持角度与弧度切换, 组合按键输入符号"
repository = "https://github.com/Jadeble/calc-tui"
license = "MIT OR Apache-2.0"
keywords = ["calculator", "tui", "cli", "math", "terminal"]
categories = ["command-line-utilities", "mathematics"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
meval = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
