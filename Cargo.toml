[package]
name = "calc-tui"
version = "0.2.1"
edition = "2024"
description = "终端科学计算器: 实数/复数运算、自定义函数、级数求和、瑕积分与求导"
repository = "https://github.com/Jadeble/calc-tui"
license = "MIT OR Apache-2.0"
keywords = ["calculator", "tui", "cli", "math", "terminal"]
categories = ["command-line-utilities", "mathematics"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
