name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: musl 静态编译, 不依赖 glibc, 可在任意 Linux 发行版直接运行
          - target: x86_64-unknown-linux-musl
            name: x86_64-linux-musl
          - target: aarch64-unknown-linux-musl
            name: aarch64-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 musl 交叉编译工具链
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: 构建 release(musl 静态,不依赖 glibc)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 重命名二进制(带平台标识,免解压)
        run: cp "target/${{ matrix.target }}/release/calc-tui" "calc-tui-${{ matrix.name }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: calc-tui-${{ matrix.name }}
          path: calc-tui-${{ matrix.name }}
          if-no-files-found: error

  publish:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布二进制到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
