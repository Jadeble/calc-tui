name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: musl 静态编译, 不依赖 glibc, 可在任意 Linux 发行版直接运行
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: x86_64-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: aarch64-linux-musl
          # Windows / macOS: 原生编译
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: x86_64-windows
          - os: macos-latest
            target: aarch64-apple-darwin
            name: aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            name: x86_64-macos
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 musl 交叉编译工具链
        if: runner.os == 'Linux'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: 构建 release(musl 静态,不依赖 glibc)
        if: runner.os == 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 构建 release
        if: runner.os != 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 重命名二进制(带平台标识,免解压)
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/calc-tui"
          if [ -f "$BIN.exe" ]; then
            cp "$BIN.exe" "calc-tui-${{ matrix.name }}.exe"
          else
            cp "$BIN" "calc-tui-${{ matrix.name }}"
          fi

      - name: 发布二进制到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: calc-tui-*
